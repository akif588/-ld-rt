        async function uploadToGitHub(base64Data, filename) {
            const path = `fotolar/${filename}`;
            const url = `https://api.github.com/repos/${REPO_INFO}/contents/${path}`;
            
            // Base64 verisinin başındaki meta kısmını temizle
            const base64Content = base64Data.split(',')[1];

            const bodyData = {
                message: `Fotoğraf eklendi: ${filename}`,
                content: base64Content,
                branch: "main"
            };

            console.log("GitHub'a yükleniyor:", path);

            try {
                let response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });
                
                let result = await response.json();
                if (response.ok) {
                    console.log("Başarıyla yüklendi!", result);
                } else {
                    console.error("GitHub API Hatası:", result);
                }
            } catch (err) {
                console.error("Ağ veya CORS Hatası:", err);
            }
        }
