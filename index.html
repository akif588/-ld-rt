<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Bulut Deposu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input { background: #334155; color: #fff; }
        button { background: #3b82f6; color: #white; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
            justify-content: center;
        }
        .photo-card {
            background: #334155;
            padding: 8px;
            border-radius: 8px;
            width: 45%;
        }
        .photo-card img {
            width: 100%;
            border-radius: 4px;
        }
        .download-btn {
            background: #10b981;
            font-size: 12px;
            padding: 6px;
            margin-top: 5px;
            text-decoration: none;
            display: block;
            color: white;
            border-radius: 4px;
        }
        #statusMsg {
            font-size: 14px;
            margin: 10px 0;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Giriş Ekranı -->
        <div id="loginScreen">
            <h2>Kişisel Bulut</h2>
            <p>Dolabına erişmek için adını yaz:</p>
            <input type="text" id="usernameInput" placeholder="Adın veya Rumuzun">
            <button onclick="login()">Dolabımı Aç</button>
        </div>

        <!-- Dolap Ekranı -->
        <div id="dashboardScreen" style="display: none;">
            <h2 id="welcomeTitle"></h2>
            <p id="roleInfo" style="color: #38bdf8; font-size: 14px;"></p>
            
            <input type="file" id="fileInput" accept="image/*">
            <button onclick="uploadPhoto()">Fotoğraf Yükle</button>
            <p id="statusMsg"></p>
            
            <h3>Fotoğraflar</h3>
            <div class="gallery" id="photoGallery">
                <p>Yükleniyor...</p>
            </div>
            
            <button onclick="logout()" style="background: #ef4444; margin-top: 20px;">Çıkış Yap</button>
        </div>
    </div>

    <script>
        const GITHUB_TOKEN = 'Ghp_IEiPql2E4HGvq7BWVP2fVoDIUYDuVZ1nKstu'; 
        const REPO_INFO = 'akif588/Game';

        let currentUser = '';

        async function login() {
            const inputVal = document.getElementById('usernameInput').value.trim();
            if (!inputVal) {
                alert("Lütfen bir isim yaz kanka!");
                return;
            }
            currentUser = inputVal;
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';

            if (currentUser === 'admin12') {
                document.getElementById('welcomeTitle').innerText = "Admin Paneli";
                document.getElementById('roleInfo').innerText = "Tüm kullanıcıların fotoğraflarını görüyorsun.";
                document.getElementById('fileInput').style.display = 'none';
            } else {
                document.getElementById('welcomeTitle').innerText = `Hoş geldin, ${currentUser}`;
                document.getElementById('roleInfo').innerText = "Bu senin kişisel bulut dolabın.";
            }

            await loadPhotos();
        }

        function logout() {
            currentUser = '';
            document.getElementById('usernameInput').value = '';
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'block';
        }

        async function uploadPhoto() {
            const fileInput = document.getElementById('fileInput');
            const statusMsg = document.getElementById('statusMsg');
            
            if (fileInput.files.length === 0) {
                alert("Önce bir fotoğraf seç kanka!");
                return;
            }

            const file = fileInput.files[0];
            statusMsg.innerText = "Fotoğraf hazırlanıyor...";

            // Telefon fotoğraflarının boyutu büyük olduğu için canvas ile küçültelim (optimize edelim)
            const reader = new FileReader();
            reader.readAsDataURL(file);
            
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Genişliği sınırla ki GitHub API hata vermesin
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64Data = canvas.toDataURL('image/jpeg', 0.7);
                    const base64Content = base64Data.split(',')[1];
                    const timestamp = Date.now();
                    const path = `bulut_depo/${currentUser}/foto_${timestamp}.jpg`;
                    const url = `https://api.github.com/repos/${REPO_INFO}/contents/${path}`;

                    const bodyData = {
                        message: `${currentUser} fotoğraf yükledi`,
                        content: base64Content,
                        branch: "main"
                    };

                    statusMsg.innerText = "GitHub'a yükleniyor...";

                    try {
                        let response = await fetch(url, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${GITHUB_TOKEN}`,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(bodyData)
                        });

                        let resJson = await response.json();

                        if (response.ok) {
                            statusMsg.innerText = "Yükleme başarılı! 🎉";
                            fileInput.value = '';
                            await loadPhotos();
                        } else {
                            statusMsg.innerText = "Hata: " + (resJson.message || "Yüklenemedi");
                        }
                    } catch (err) {
                        statusMsg.innerText = "Bağlantı hatası oluştu.";
                    }
                };
            };
        }

        async function loadPhotos() {
            const gallery = document.getElementById('photoGallery');
            gallery.innerHTML = '<p>Yükleniyor...</p>';

            try {
                if (currentUser === 'admin12') {
                    let allFiles = [];
                    let res = await fetch(`https://api.github.com/repos/${REPO_INFO}/contents/bulut_depo`, {
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                    });
                    
                    if (res.ok) {
                        let users = await res.json();
                        for (let userFolder of users) {
                            if (userFolder.type === 'dir') {
                                let userRes = await fetch(userFolder.url, {
                                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                                });
                                if (userRes.ok) {
                                    let userFiles = await userRes.json();
                                    allFiles = allFiles.concat(userFiles);
                                }
                            }
                        }
                    }
                    renderGallery(allFiles);
                } else {
                    let url = `https://api.github.com/repos/${REPO_INFO}/contents/bulut_depo/${currentUser}`;
                    let res = await fetch(url, {
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                    });

                    if (res.ok) {
                        let files = await res.json();
                        renderGallery(files);
                    } else {
                        gallery.innerHTML = '<p>Henüz fotoğrafın yok.</p>';
                    }
                }
            } catch (err) {
                gallery.innerHTML = '<p>Fotoğraflar yüklenemedi.</p>';
            }
        }

        function renderGallery(files) {
            const gallery = document.getElementById('photoGallery');
            gallery.innerHTML = '';

            if (!files || files.length === 0) {
                gallery.innerHTML = '<p>Hiç fotoğraf bulunamadı.</p>';
                return;
            }

            files.forEach(file => {
                if (file.type === 'file' && (file.name.endsWith('.jpg') || file.name.endsWith('.png') || file.name.endsWith('.jpeg'))) {
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.innerHTML = `
                        <img src="${file.download_url}" alt="Fotoğraf">
                        <a class="download-btn" href="${file.download_url}" target="_blank" download>İndir</a>
                    `;
                    gallery.appendChild(card);
                }
            });
        }
    </script>
</body>
</html>
