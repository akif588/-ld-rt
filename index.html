<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub -> Termux Python Köprüsü</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            border: 1px solid #334155;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
        }
        button:hover { background: #0ea5e9; }
        input {
            width: calc(100% - 16px);
            padding: 8px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .box {
            background: #0f172a;
            padding: 10px;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 13px;
            color: #38bdf8;
            min-height: 30px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 Python & Web Köprüsü</h2>
        <p style="font-size: 11px; color: #94a3b8;">Hedef IP: <span id="ip-text"></span></p>

        <!-- Python'dan Veri Çekme -->
        <button onclick="pythonVeriCek()">Telefondan Veri Çek (GET)</button>
        
        <!-- Python'a Veri Gönderme -->
        <input type="text" id="mesajInput" placeholder="Telefona mesaj yaz kanka...">
        <button onclick="pythonVeriGonder()">Telefona Veri Gönder (POST)</button>

        <div class="box" id="sonucBox">Sonuçlar burada görünecek kanka...</div>
    </div>

    <script>
        // Senin verdiğin IP adresi ve Flask portu
        const PYTHON_URL = "http://192.168.0.112:5000";
        document.getElementById('ip-text').innerText = PYTHON_URL;

        async function pythonVeriCek() {
            const box = document.getElementById('sonucBox');
            box.innerText = "Telefondan veri isteniyor...";
            try {
                const response = await fetch(`${PYTHON_URL}/api/veri-cek`);
                const data = await response.json();
                box.innerText = `[GET Başarılı] ${data.mesaj}`;
            } catch (error) {
                box.innerText = "Hata: Telefona ulaşılamadı kanka! Wi-Fi'da mısın veya Flask açık mı?";
                console.error(error);
            }
        }

        async function pythonVeriGonder() {
            const box = document.getElementById('sonucBox');
            const mesaj = document.getElementById('mesajInput').value;
            if(!mesaj) {
                box.innerText = "Önce kutuya bişeyler yaz kanka!";
                return;
            }

            box.innerText = "Telefona gönderiliyor...";
            try {
                const response = await fetch(`${PYTHON_URL}/api/veri-gonder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mesaj: mesaj })
                });
                const data = await response.json();
                box.innerText = `[POST Başarılı] ${data.cevap}`;
            } catch (error) {
                box.innerText = "Hata: Veri gönderilemedi kanka!";
                console.error(error);
            }
        }
    </script>
</body>
</html>
